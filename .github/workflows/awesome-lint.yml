name: lint

on:
  push:
    branches: [main]
  pull_request:
  # weekly dead-link sweep
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run awesome-lint
        run: npx awesome-lint

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # GET, not HEAD: several scholarly hosts reject HEAD (De Gruyter 405).
          # 202 is what doi.org answers for some publishers; 429 is rate limiting.
          # The two excluded hosts are alive but serve a broken TLS chain / HTTP2.
          args: >-
            --no-progress --method get --timeout 60
            --max-retries 5 --retry-wait-time 5
            --accept 200,202,206,403,405,429
            --exclude oracc\.museum\.upenn\.edu
            --exclude www\.sacred-texts\.com
            --exclude heimskringla\.no
            --exclude openhumanitiesdata\.metajnl\.com
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
